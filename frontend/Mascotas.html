<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas — Patitas Felices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg pf-navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">🐾 Patitas Felices</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pfNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="pfNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="duenios.html">Dueños</a></li>
                <li class="nav-item"><a class="nav-link active" href="mascotas.html">Mascotas</a></li>
                <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Mascotas</h2>
        <button type="button" class="btn btn-pf-primario" data-bs-toggle="modal" data-bs-target="#modalMascota" onclick="abrirParaCrear()">
            + Nueva mascota
        </button>
    </div>

    <div class="pf-panel">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Raza</th>
                    <th>Fecha nac.</th>
                    <th>Dueño</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaMascotas"></tbody>
            </table>
        </div>
        <p id="sinDatos" class="text-muted mt-3 mb-0 d-none">No hay mascotas registradas todavía.</p>
    </div>
</div>

<div class="modal fade" id="modalMascota" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formMascota">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Registrar nueva mascota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="errorForm" class="alert alert-danger d-none" role="alert"></div>
                    <input type="hidden" id="mascotaId">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especie</label>
                        <input type="text" class="form-control" id="especie" placeholder="Perro, Gato, etc." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Raza</label>
                        <input type="text" class="form-control" id="raza">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dueño</label>
                        <select class="form-select" id="idDuenio" required>
                            <option value="" disabled selected>Seleccioná un dueño...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-pf-secundario" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-pf-primario" id="btnGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="pf-footer">
    <div class="container text-center">🐾 Patitas Felices — Sistema interno de gestión</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8080";
    const URL_MASCOTAS = API_BASE + "/api/mascota";
    const URL_DUENIOS = API_BASE + "/api/duenio";

    const tabla = document.getElementById("tablaMascotas");
    const sinDatos = document.getElementById("sinDatos");
    const alerta = document.getElementById("alerta");
    const errorForm = document.getElementById("errorForm");
    const form = document.getElementById("formMascota");
    const modalEl = document.getElementById("modalMascota");
    const modal = new bootstrap.Modal(modalEl);
    const tituloModal = document.getElementById("tituloModal");
    const btnGuardar = document.getElementById("btnGuardar");
    const campoId = document.getElementById("mascotaId");
    const selectDuenio = document.getElementById("idDuenio");

    function mostrarAlerta(mensaje, tipo) {
        alerta.textContent = mensaje;
        alerta.className = "alert alert-" + tipo;
    }

    function escapar(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ---- Carga el combo de dueños (para el <select>) ----
    async function cargarDuenosEnCombo() {
        try {
            const respuesta = await fetch(URL_DUENIOS);
            if (!respuesta.ok) throw new Error("No se pudieron cargar los dueños");
            const duenios = await respuesta.json();

            selectDuenio.innerHTML = '<option value="" disabled selected>Seleccioná un dueño...</option>';
            duenios.forEach(d => {
                const opcion = document.createElement("option");
                opcion.value = d.id;
                opcion.textContent = d.nombre + " " + d.apellido + " (DNI " + d.cedula + ")";
                selectDuenio.appendChild(opcion);
            });
        } catch (error) {
            mostrarAlerta("No se pudo cargar la lista de dueños para el combo. (" + error.message + ")", "danger");
        }
    }

    async function cargarMascotas() {
        try {
            const respuesta = await fetch(URL_MASCOTAS);
            if (!respuesta.ok) throw new Error("El servidor respondió " + respuesta.status);
            pintarTabla(await respuesta.json());
        } catch (error) {
            mostrarAlerta("No se pudo conectar con la API en " + API_BASE + ". (" + error.message + ")", "danger");
        }
    }

    function pintarTabla(mascotas) {
        tabla.innerHTML = "";
        if (!mascotas || mascotas.length === 0) {
            sinDatos.classList.remove("d-none");
            return;
        }
        sinDatos.classList.add("d-none");
        mascotas.forEach(m => {
            const fila = document.createElement("tr");
            fila.innerHTML =
                "<td>" + (m.id ?? "") + "</td>" +
                "<td>" + escapar(m.nombre) + "</td>" +
                "<td>" + escapar(m.especie) + "</td>" +
                "<td>" + escapar(m.raza) + "</td>" +
                "<td>" + (m.fechaNacimiento ?? "") + "</td>" +
                "<td>" + escapar(m.duenioNombre) + "</td>" +
                "<td class='text-end'>" +
                "  <button class='btn btn-pf-editar me-1' onclick='abrirParaEditar(" + m.id + ")'>Editar</button>" +
                "  <button class='btn btn-pf-eliminar' onclick='eliminarMascota(" + m.id + ")'>Eliminar</button>" +
                "</td>";
            tabla.appendChild(fila);
        });
    }

    function abrirParaCrear() {
        form.reset();
        campoId.value = "";
        selectDuenio.value = "";
        tituloModal.textContent = "Registrar nueva mascota";
        btnGuardar.textContent = "Guardar";
        errorForm.classList.add("d-none");
    }

    async function abrirParaEditar(id) {
        try {
            const respuesta = await fetch(URL_MASCOTAS + "/" + id);
            if (!respuesta.ok) throw new Error("No se pudo obtener la mascota");
            const m = await respuesta.json();

            campoId.value = m.id;
            document.getElementById("nombre").value = m.nombre ?? "";
            document.getElementById("especie").value = m.especie ?? "";
            document.getElementById("raza").value = m.raza ?? "";
            document.getElementById("fechaNacimiento").value = m.fechaNacimiento ?? "";
            selectDuenio.value = m.idDuenio ?? "";

            tituloModal.textContent = "Editar mascota";
            btnGuardar.textContent = "Guardar cambios";
            errorForm.classList.add("d-none");
            modal.show();
        } catch (error) {
            mostrarAlerta("No se pudo cargar la mascota para editar. (" + error.message + ")", "danger");
        }
    }

    async function eliminarMascota(id) {
        if (!confirm("¿Eliminar esta mascota? Esta acción no se puede deshacer.")) return;
        try {
            const respuesta = await fetch(URL_MASCOTAS + "/" + id, { method: "DELETE" });
            if (respuesta.ok || respuesta.status === 204) {
                mostrarAlerta("Mascota eliminada correctamente.", "success");
                await cargarMascotas();
            } else {
                mostrarAlerta(await extraerMensajeError(respuesta), "danger");
            }
        } catch (error) {
            mostrarAlerta("Error de conexión al eliminar. (" + error.message + ")", "danger");
        }
    }

    form.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        errorForm.classList.add("d-none");

        const id = campoId.value;
        const fecha = document.getElementById("fechaNacimiento").value;
        const cuerpo = {
            nombre: document.getElementById("nombre").value.trim(),
            especie: document.getElementById("especie").value.trim(),
            raza: document.getElementById("raza").value.trim(),
            fechaNacimiento: fecha || null,
            idDuenio: selectDuenio.value ? Number(selectDuenio.value) : null
        };

        try {
            const respuesta = await fetch(id ? URL_MASCOTAS + "/" + id : URL_MASCOTAS, {
                method: id ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(cuerpo)
            });

            if (respuesta.ok) {
                modal.hide();
                form.reset();
                mostrarAlerta(id ? "Mascota actualizada correctamente." : "Mascota creada correctamente.", "success");
                await cargarMascotas();
            } else {
                errorForm.textContent = await extraerMensajeError(respuesta);
                errorForm.classList.remove("d-none");
            }
        } catch (error) {
            errorForm.textContent = "Error de conexión con la API: " + error.message;
            errorForm.classList.remove("d-none");
        }
    });

    async function extraerMensajeError(respuesta) {
    const texto = await respuesta.text().catch(() => "");
    try {
        const cuerpo = JSON.parse(texto);
        if (cuerpo.mensaje) return cuerpo.mensaje;
        if (cuerpo.message) return cuerpo.message;
        if (cuerpo.errors) return JSON.stringify(cuerpo.errors);
        return "Error " + respuesta.status + ": " + texto;
    } catch (e) {
        return texto || ("El servidor respondió con estado " + respuesta.status);
    }
}

    document.addEventListener("DOMContentLoaded", () => {
        cargarDuenosEnCombo();
        cargarMascotas();
    });
</script>
</body>
</html>
