<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dueños — Patitas Felices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg pf-navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">🐾 Patitas Felices</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pfNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="pfNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="duenios.html">Dueños</a></li>
                <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Dueños registrados</h2>
        <button type="button" class="btn btn-pf-primario" data-bs-toggle="modal" data-bs-target="#modalDuenio" onclick="abrirParaCrear()">
            + Nuevo dueño
        </button>
    </div>

    <div class="pf-panel">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaDuenios"></tbody>
            </table>
        </div>
        <p id="sinDatos" class="text-muted mt-3 mb-0 d-none">No hay dueños registrados todavía.</p>
    </div>
</div>

<!-- ===== Modal alta/edición ===== -->
<div class="modal fade" id="modalDuenio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formDuenio">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Registrar nuevo dueño</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="errorForm" class="alert alert-danger d-none" role="alert"></div>
                    <input type="hidden" id="duenioId">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control" id="cedula" placeholder="Entre 7 y 8 dígitos" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="number" class="form-control" id="telefono">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-pf-secundario" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-pf-primario" id="btnGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="pf-footer">
    <div class="container text-center">🐾 Patitas Felices — Sistema interno de gestión</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8080";
    const URL_DUENIOS = API_BASE + "/api/duenio";

    const tabla = document.getElementById("tablaDuenios");
    const sinDatos = document.getElementById("sinDatos");
    const alerta = document.getElementById("alerta");
    const errorForm = document.getElementById("errorForm");
    const form = document.getElementById("formDuenio");
    const modalEl = document.getElementById("modalDuenio");
    const modal = new bootstrap.Modal(modalEl);
    const tituloModal = document.getElementById("tituloModal");
    const btnGuardar = document.getElementById("btnGuardar");
    const campoId = document.getElementById("duenioId");

    function mostrarAlerta(mensaje, tipo) {
        alerta.textContent = mensaje;
        alerta.className = "alert alert-" + tipo;
    }

    function escapar(texto) {
        if (texto === null || texto === undefined) return "";
        return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function cargarDuenios() {
        try {
            const respuesta = await fetch(URL_DUENIOS);
            if (!respuesta.ok) throw new Error("El servidor respondió " + respuesta.status);
            pintarTabla(await respuesta.json());
        } catch (error) {
            mostrarAlerta("No se pudo conectar con la API en " + API_BASE + ". (" + error.message + ")", "danger");
        }
    }

    function pintarTabla(duenios) {
        tabla.innerHTML = "";
        if (!duenios || duenios.length === 0) {
            sinDatos.classList.remove("d-none");
            return;
        }
        sinDatos.classList.add("d-none");
        duenios.forEach(d => {
            const fila = document.createElement("tr");
            fila.innerHTML =
                "<td>" + (d.id ?? "") + "</td>" +
                "<td>" + escapar(d.nombre) + "</td>" +
                "<td>" + escapar(d.apellido) + "</td>" +
                "<td>" + escapar(d.cedula) + "</td>" +
                "<td>" + (d.telefono ?? "") + "</td>" +
                "<td>" + escapar(d.email) + "</td>" +
                "<td class='text-end'>" +
                "  <button class='btn btn-pf-editar me-1' onclick='abrirParaEditar(" + d.id + ")'>Editar</button>" +
                "  <button class='btn btn-pf-eliminar' onclick='eliminarDuenio(" + d.id + ")'>Eliminar</button>" +
                "</td>";
            tabla.appendChild(fila);
        });
    }

    function abrirParaCrear() {
        form.reset();
        campoId.value = "";
        tituloModal.textContent = "Registrar nuevo dueño";
        btnGuardar.textContent = "Guardar";
        errorForm.classList.add("d-none");
    }

    async function abrirParaEditar(id) {
        try {
            const respuesta = await fetch(URL_DUENIOS + "/" + id);
            if (!respuesta.ok) throw new Error("No se pudo obtener el dueño");
            const d = await respuesta.json();

            campoId.value = d.id;
            document.getElementById("nombre").value = d.nombre ?? "";
            document.getElementById("apellido").value = d.apellido ?? "";
            document.getElementById("cedula").value = d.cedula ?? "";
            document.getElementById("telefono").value = d.telefono ?? "";
            document.getElementById("email").value = d.email ?? "";

            tituloModal.textContent = "Editar dueño";
            btnGuardar.textContent = "Guardar cambios";
            errorForm.classList.add("d-none");
            modal.show();
        } catch (error) {
            mostrarAlerta("No se pudo cargar el dueño para editar. (" + error.message + ")", "danger");
        }
    }

    async function eliminarDuenio(id) {
        if (!confirm("¿Eliminar este dueño? Esta acción no se puede deshacer.")) return;
        try {
            const respuesta = await fetch(URL_DUENIOS + "/" + id, { method: "DELETE" });
            if (respuesta.ok || respuesta.status === 204) {
                mostrarAlerta("Dueño eliminado correctamente.", "success");
                await cargarDuenios();
            } else {
                mostrarAlerta(await extraerMensajeError(respuesta), "danger");
            }
        } catch (error) {
            mostrarAlerta("Error de conexión al eliminar. (" + error.message + ")", "danger");
        }
    }

    form.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        errorForm.classList.add("d-none");

        const telefonoValor = document.getElementById("telefono").value;
        const id = campoId.value;
        const cuerpo = {
            nombre: document.getElementById("nombre").value.trim(),
            apellido: document.getElementById("apellido").value.trim(),
            cedula: document.getElementById("cedula").value.trim(),
            telefono: telefonoValor ? Number(telefonoValor) : null,
            email: document.getElementById("email").value.trim()
        };

        try {
            const respuesta = await fetch(id ? URL_DUENIOS + "/" + id : URL_DUENIOS, {
                method: id ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(cuerpo)
            });

            if (respuesta.ok) {
                modal.hide();
                form.reset();
                mostrarAlerta(id ? "Dueño actualizado correctamente." : "Dueño creado correctamente.", "success");
                await cargarDuenios();
            } else {
                errorForm.textContent = await extraerMensajeError(respuesta);
                errorForm.classList.remove("d-none");
            }
        } catch (error) {
            errorForm.textContent = "Error de conexión con la API: " + error.message;
            errorForm.classList.remove("d-none");
        }
    });

    async function extraerMensajeError(respuesta) {
        const texto = await respuesta.text().catch(() => "");
        try {
            const cuerpo = JSON.parse(texto);
            if (cuerpo.message) return cuerpo.message;
            if (cuerpo.errors) return JSON.stringify(cuerpo.errors);
            return "Error " + respuesta.status + ": " + texto;
        } catch (e) {
            return texto || ("El servidor respondió con estado " + respuesta.status);
        }
    }

    document.addEventListener("DOMContentLoaded", cargarDuenios);
</script>
</body>
</html>
